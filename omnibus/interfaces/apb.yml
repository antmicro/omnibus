id:
  library: libdefault
  name: APB3
  vendor: vendor

parameters:
  ADDR_WIDTH: 32
  DATA_WIDTH: 32

signals:
  PADDR:
    pattern: paddr
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [ADDR_WIDTH - 1, 0]
  PPROT:
    pattern: pprot
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [2, 0]
  PSEL:
    pattern: psel
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  PENABLE:
    pattern: penable
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  PWRITE:
    pattern: pwrite
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  PWDATA:
    pattern: pwdata
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [DATA_WIDTH - 1, 0]
  PSTRB:
    pattern: pstrb
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [DATA_WIDTH/8 - 1, 0]
  PREADY:
    pattern: pready
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
  PRDATA:
    pattern: prdata
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
    bound: [DATA_WIDTH - 1, 0]
  PSLVERR:
    pattern: pslverr
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
