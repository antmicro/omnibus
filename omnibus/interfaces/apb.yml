id:
  library: libdefault
  name: APB3
  vendor: vendor

parameters:
  ADDR_WIDTH: 32
  DATA_WIDTH: 32

signals:
  paddr:
    pattern: paddr
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [ADDR_WIDTH - 1, 0]
  pprot:
    pattern: pprot
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [2, 0]
  psel:
    pattern: psel
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  penable:
    pattern: penable
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  pwrite:
    pattern: pwrite
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  pwdata:
    pattern: pwdata
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [DATA_WIDTH - 1, 0]
  pstrb:
    pattern: pstrb
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [DATA_WIDTH/8 - 1, 0]
  pready:
    pattern: pready
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
  prdata:
    pattern: prdata
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
    bound: [DATA_WIDTH - 1, 0]
  pslverr:
    pattern: pslverr
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
