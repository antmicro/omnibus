id:
  library: libdefault
  name: AHB3
  vendor: vendor

parameters:
  ADDR_WIDTH: 32
  DATA_WIDTH: 64

signals:
  haddr:
    pattern: haddr
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [ADDR_WIDTH - 1, 0]
  hmastlock:
    pattern: hmastlock
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  hburst:
    pattern: hburst
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [2, 0]
  hprot:
    pattern: hprot
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [3, 0]
  hsize:
    pattern: hsize
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [2, 0]
  htrans:
    pattern: htrans
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [1, 0]
  hwdata:
    pattern: hwdata
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
    bound: [DATA_WIDTH - 1, 0]
  hwrite:
    pattern: hwrite
    modes: {manager: [out, required], subordinate: [in, required]}
    default: 0
  hrdata:
    pattern: hrdata
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
    bound: [DATA_WIDTH - 1, 0]
  hready:
    pattern: hready
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
  hresp:
    pattern: hresp
    modes: {manager: [in, required], subordinate: [out, required]}
    default: 0
