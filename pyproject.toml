[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name="omnibus"
version = "0.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies=[
    "ruamel.yaml",
    "pyyaml",
    "graphviz",
    "jsonschema>=4.18",
    "topwrap @ git+https://github.com/antmicro/topwrap@8ada28df663bc3329ba13e8df430c0a2703c232b"]

[project.optional-dependencies]
test = [
    "pytest",
    "rich"]
# simulation tests in tests/sim; they also need Verilator
sim = [
    "pytest",
    "cocotb==2.0.1",
    "cocotbext-axi==0.1.28",
    "cocotb-ahb @ git+https://github.com/antmicro/cocotb-ahb@b9fb4abffd2531ec07be8edd30a08db18697b47e"]

[project.scripts]
omnibus = "omnibus.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include=["omnibus*"]

[tool.setuptools.package-data]
"*" = ["*.sv", "*.yml"]
