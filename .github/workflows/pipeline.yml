name: Pipeline

on:
  pull_request:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build_docs:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pip python3-venv make texlive-full imagemagick
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Generate documentation
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r docs/requirements.txt
          sphinx-build -M html docs docs/build --keep-going
          sphinx-build -M latexpdf docs docs/build --keep-going
          cp docs/build/latex/omnibus.pdf docs/build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy_docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build_docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
