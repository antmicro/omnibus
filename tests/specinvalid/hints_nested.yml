desc_version: 1.0

default:
  frequency: 1
  clock: clk
  protocol: axi4
  data_width: 32

ports:
  a:
    role: "subordinate"
    datawidth: 32
  b:
    role: "manager"

crossbars:
  main:
    clocks: clk
    ports:
      a:
        role: "subordinate"
      b:
        rol: "manager"

connections:
  "a -> main.a":
  "main.b -> b":

address_map:
  b:
    to: b
    bse: 0
    size: 16
