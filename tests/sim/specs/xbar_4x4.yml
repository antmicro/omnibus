# Four managers, four memories from 4 KiB to 16 MiB.
desc_version: 1.0
name: xbar_4x4
default:
  data_width: 64
  clock: clk
  frequency: 100MHz
  protocol: axi4
ports:
  cpu0:
    role: subordinate
  cpu1:
    role: subordinate
  cpu2:
    role: subordinate
  cpu3:
    role: subordinate
  mem0:
    role: manager
  mem1:
    role: manager
  mem2:
    role: manager
  mem3:
    role: manager
address_map:
  mem0:
    to: mem0
    base: 0x0000_1000
    size: 0x0000_1000
  mem1:
    to: mem1
    base: 0x0001_0000
    size: 0x0001_0000
  mem2:
    to: mem2
    base: 0x1000_0000
    size: 0x0100_0000
  mem3:
    to: mem3
    base: 0x4000_0000
    size: 0x0000_4000
