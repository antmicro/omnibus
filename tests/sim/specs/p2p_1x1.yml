# One manager, one memory, implicit crossbar: the baseline.
desc_version: 1.0
name: p2p_1x1
default:
  data_width: 64
  clock: clk
  frequency: 100MHz
  protocol: axi4
ports:
  cpu:
    role: subordinate
  mem:
    role: manager
address_map:
  mem:
    to: mem
    base: 0x1000_0000
    size: 0x0100_0000
