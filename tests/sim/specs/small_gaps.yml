# Gaps smaller than a bus word between the windows, which can only be accessed with
# narrow beats.
desc_version: 1.0
name: small_gaps
default:
  data_width: 64
  clock: clk
  frequency: 100MHz
  protocol: axi4
ports:
  cpu:
    role: subordinate
  mem_a:
    role: manager
  mem_b:
    role: manager
  mem_c:
    role: manager
address_map:
  win_a:
    to: mem_a
    base: 0x1000_0000
    size: 0x0000_1000
  win_b:
    to: mem_b
    base: 0x1000_1004
    size: 0x0000_1000
  win_c:
    to: mem_c
    base: 0x1000_2005
    size: 0x0000_1000
