# Register slices (skid buffers) between the crossbar and the memory.
desc_version: 1.0
name: regslice
default:
  data_width: 64
  clock: clk
  frequency: 100MHz
  protocol: axi4
ports:
  cpu:
    role: subordinate
  mem:
    role: manager
crossbars:
  main:
    ports:
      cpu:
        role: subordinate
      mem:
        role: manager
connections:
  "cpu -> main.cpu":
  "main.mem -> mem":
    registers: 1
address_map:
  mem:
    to: mem
    base: 0x1000_0000
    size: 0x0010_0000
