# Two crossbars in series: both managers reach the near memory directly and two
# far memories through the second crossbar.
desc_version: 1.0
name: chain
default:
  data_width: 64
  clock: clk
  frequency: 100MHz
  protocol: axi4
ports:
  cpu0:
    role: subordinate
  cpu1:
    role: subordinate
  mem:
    role: manager
  far0:
    role: manager
  far1:
    role: manager
crossbars:
  near:
    ports:
      c0:
        role: subordinate
      c1:
        role: subordinate
      mem:
        role: manager
      down:
        role: manager
  far:
    ports:
      up:
        role: subordinate
      f0:
        role: manager
      f1:
        role: manager
connections:
  "cpu0 -> near.c0":
  "cpu1 -> near.c1":
  "near.mem -> mem":
  "near.down -> far.up":
  "far.f0 -> far0":
  "far.f1 -> far1":
address_map:
  mem:
    to: mem
    base: 0x1000_0000
    size: 0x0010_0000
  far0:
    to: far0
    base: 0x2000_0000
    size: 0x0001_0000
  far1:
    to: far1
    base: 0x2001_0000
    size: 0x0001_0000
