# AXI4 -> APB conversion next to a plain AXI4 memory.
desc_version: 1.0
name: apb
default:
  data_width: 64
  clock: clk
  frequency: 100MHz
  protocol: axi4
ports:
  cpu:
    role: subordinate
  mem:
    role: manager
  regs:
    role: manager
    protocol: apb
address_map:
  mem:
    to: mem
    base: 0x1000_0000
    size: 0x0010_0000
  regs:
    to: regs
    base: 0x4000_0000
    size: 0x0000_1000
