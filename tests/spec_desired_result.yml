connections:
  interfaces:
    cdc_axi_cpu_clk_cpu_to_sb_cpu_cpu_clk_bus:
      dst:
      - sb_cpu
      - sb_cpu_cpu
      src: axi_cpu
    cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp:
      dst:
      - sb_lpp
      - sb_lpp_up
    pr_conv_sb_lpp_i2c_AXI4_to_apb_i2c_APB:
      dst: apb_i2c
    pr_conv_sb_lpp_uart_AXI4_to_apb_uart_APB:
      dst: apb_uart
    sb_cpu:
      sb_cpu_dbg: axi_dbg
      sb_cpu_lpp:
      - cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp
      - src
      sb_cpu_mem: axi_mem
    sb_lpp:
      sb_lpp_i2c:
      - pr_conv_sb_lpp_i2c_AXI4_to_apb_i2c_APB
      - src
      sb_lpp_uart:
      - pr_conv_sb_lpp_uart_AXI4_to_apb_uart_APB
      - src
  ports:
    cdc_axi_cpu_clk_cpu_to_sb_cpu_cpu_clk_bus:
      dst_clk_i: clk_bus
      src_clk_i: clk_cpu
    cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp:
      dst_clk_i: clk_lpp
      src_clk_i: clk_bus
    pr_conv_sb_lpp_i2c_AXI4_to_apb_i2c_APB:
      clk_i: clk_lpp
    pr_conv_sb_lpp_uart_AXI4_to_apb_uart_APB:
      clk_i: clk_lpp
    sb_cpu:
      clk_i: clk_bus
    sb_lpp:
      clk_i: clk_lpp
external:
  interfaces:
    in:
    - axi_cpu
    - axi_dbg
    out:
    - axi_mem
    - apb_uart
    - apb_i2c
  ports:
    in:
    - clk_bus
    - clk_cpu
    - clk_lpp
ips:
  cdc_axi_cpu_clk_cpu_to_sb_cpu_cpu_clk_bus:
    file: file:./out/modules/cores/axi_cdc_wrapper/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 1
  cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp:
    file: file:./out/modules/cores/axi_cdc_wrapper/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 2
  pr_conv_sb_lpp_i2c_AXI4_to_apb_i2c_APB:
    file: file:./out/modules/cores/axi_prconv_axi_apb/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 2
  pr_conv_sb_lpp_uart_AXI4_to_apb_uart_APB:
    file: file:./out/modules/cores/axi_prconv_axi_apb/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 2
  sb_cpu:
    file: file:./out/modules/cores/sb_cpu/module.yaml
    parameters: {}
  sb_lpp:
    file: file:./out/modules/cores/sb_lpp/module.yaml
    parameters: {}
name: MyInterconnect
