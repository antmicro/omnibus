desc_version: 1.0

default:
  data_width: 64
  clock: clk
  frequency: 10MHz
  protocol: axi4

ports:
  pin:
    role: "subordinate"
    protocol: "apb"
  pout:
    role: "manager"

crossbars:
  main:
    ports:
      pin:
        role: "subordinate"
      pout:
        role: "manager"

connections:
  "pin -> main.pin":
    protocol: True
  "main.pout -> pout":
    protocol: False

address_map:
  pout:  
    to: pout
    base: 0x0000_0000
    size: 0xFFFF_FFFF
