desc_version: 1.0

default:
  data_width: 64
  clock: clk
  frequency: 10MHz
  protocol: axi4

ports:
  pin:
    role: "subordinate"
    data_width: 64
  pout:
    role: "manager"

crossbars:
  xb:
    ports:
      in: 
        role: "subordinate"
      out: 
        role: "manager"
  
connections:
  "pin -> xb.in":
    data_width: 16
  "xb.out -> pout":
    data_width: 32

address_map:
  paout:
    to: pout
    base: 0
    size: 0xFFFF_FFFF
