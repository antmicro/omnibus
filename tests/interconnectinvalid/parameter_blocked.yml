desc_version: 1.0

default:
  data_width: 64
  frequency: 10MHz
  protocol: axi4

ports:
  pin:
    role: "subordinate"
    clock: clk
  pout:
    role: "manager"
    clock: clk

crossbars:
  xb:
    ports:
      in:
        role: "subordinate"
      out:
        role: "manager"

connections:
  "pin -> xb.in":
    cdc: True
  "xb.out -> pout":
    cdc: True

address_map:
  pout:  
    to: pout
    base: 0x0000_0000
    size: 0xFFFF_FFFF
