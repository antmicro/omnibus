desc_version: 1.0

global:
  addr_width: 16

default:
  protocol: AXI4
  clock: clk
  frequency: 1
  data_width: 32

ports:
  i0:
    role:  "subordinate"
  i1:
    role:  "subordinate"
  o0:
    role:  "manager"
  o1:
    role:  "manager"

crossbars:
  x0:
    ports:
      i0:
        role: "subordinate"
      i1:
        role: "subordinate"
      o0:
        role: "manager"
      o1:
        role: "manager"
  x1:
    ports:
      i0:
        role: "subordinate"
      i1:
        role: "subordinate"
      o0:
        role: "manager"
      o1:
        role: "manager"

connections:
  "i0 -> x0.i0":
  "i1 -> x0.i1":

#1st stage
  "x0.o0 -> x1.i1":
  "x0.o1 -> x1.i0":

#interconnect -> port
  "x1.o0 -> o0":
  "x1.o1 -> o1":

address_map:
  "o0":
    to:    o0
    base:  0x0000
    size:  0x1000
  "o1":
    to:    o1
    base:  0x1000
    size:  0x1000
