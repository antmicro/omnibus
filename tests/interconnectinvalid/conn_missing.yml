desc_version: 1.0

default:
  data_width: 64
  frequency: 10MHz
  protocol: axi4
  clock: clk

ports:
  pin:
    role: "subordinate"
  pout:
    role: "manager"

crossbars:
  xb:
    ports:
      in1:
        role: "subordinate"
      in2:
        role: "subordinate"
      out:
        role: "manager"

connections:
  "pin -> xb.in1":
  "xb.out -> pout":

address_map:
  pout:  
    to: pout
    base: 0x0000_0000
    size: 0xFFFF_FFFF
