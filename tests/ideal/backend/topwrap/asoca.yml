connections:
  interfaces:
    cdc_main_i3c_controller_clk_fast_to_i3c_controller_clk_slow:
      dst: i3c_controller
    cdc_main_i3c_target_clk_fast_to_i3c_target_clk_slow:
      dst: i3c_target
    cdc_main_timers_csr_clk_fast_to_timers_csr_clk_slow:
      dst:
      - pr_conv_cdc_timers_csr_clk_slow_axi4_to_timers_csr_apb3
      - src
    cdc_main_uart_csr_clk_fast_to_uart_csr_clk_ahb:
      dst:
      - pr_conv_cdc_uart_csr_clk_ahb_axi4_to_uart_csr_ahb3
      - src
    cdc_veer_el2_ifu_clk_slow_to_main_veer_el2_ifu_clk_fast:
      dst:
      - main
      - main_veer_el2_ifu
      src: veer_el2_ifu
    cdc_veer_el2_lsu_clk_slow_to_main_veer_el2_lsu_clk_fast:
      dst:
      - main
      - main_veer_el2_lsu
      src: veer_el2_lsu
    dw_conv_coral_npu_in_128_to_main_coral_npu_in_64:
      dst:
      - main
      - main_coral_npu_in
      src: coral_npu_in
    dw_conv_main_coral_npu_out_64_to_coral_npu_out_128:
      dst: coral_npu_out
    dw_conv_main_fast_vdma_csr_64_to_fast_vdma_csr_32:
      dst:
      - pr_conv_dw_conv_fast_vdma_csr_32_axi4_to_fast_vdma_csr_axi4lite
      - src
    main:
      main_coral_npu_out:
      - dw_conv_main_coral_npu_out_64_to_coral_npu_out_128
      - src
      main_fast_vdma: fast_vdma
      main_fast_vdma_csr:
      - dw_conv_main_fast_vdma_csr_64_to_fast_vdma_csr_32
      - src
      main_i3c_controller:
      - cdc_main_i3c_controller_clk_fast_to_i3c_controller_clk_slow
      - src
      main_i3c_target:
      - cdc_main_i3c_target_clk_fast_to_i3c_target_clk_slow
      - src
      main_timers_csr:
      - cdc_main_timers_csr_clk_fast_to_timers_csr_clk_slow
      - src
      main_uart_csr:
      - cdc_main_uart_csr_clk_fast_to_uart_csr_clk_ahb
      - src
      main_veer_eh2_ifu: veer_eh2_ifu
      main_veer_eh2_lsu: veer_eh2_lsu
    pr_conv_cdc_timers_csr_clk_slow_axi4_to_timers_csr_apb3:
      dst: timers_csr
    pr_conv_cdc_uart_csr_clk_ahb_axi4_to_uart_csr_ahb3:
      dst: uart_csr
    pr_conv_dw_conv_fast_vdma_csr_32_axi4_to_fast_vdma_csr_axi4lite:
      dst: fast_vdma_csr
  ports:
    cdc_main_i3c_controller_clk_fast_to_i3c_controller_clk_slow:
      dst_clk_i: clk_slow_i
      dst_rst_ni: rst_slow_ni
      src_clk_i: clk_fast_i
      src_rst_ni: rst_fast_ni
    cdc_main_i3c_target_clk_fast_to_i3c_target_clk_slow:
      dst_clk_i: clk_slow_i
      dst_rst_ni: rst_slow_ni
      src_clk_i: clk_fast_i
      src_rst_ni: rst_fast_ni
    cdc_main_timers_csr_clk_fast_to_timers_csr_clk_slow:
      dst_clk_i: clk_slow_i
      dst_rst_ni: rst_slow_ni
      src_clk_i: clk_fast_i
      src_rst_ni: rst_fast_ni
    cdc_main_uart_csr_clk_fast_to_uart_csr_clk_ahb:
      dst_clk_i: clk_ahb_i
      dst_rst_ni: rst_ahb_ni
      src_clk_i: clk_fast_i
      src_rst_ni: rst_fast_ni
    cdc_veer_el2_ifu_clk_slow_to_main_veer_el2_ifu_clk_fast:
      dst_clk_i: clk_fast_i
      dst_rst_ni: rst_fast_ni
      src_clk_i: clk_slow_i
      src_rst_ni: rst_slow_ni
    cdc_veer_el2_lsu_clk_slow_to_main_veer_el2_lsu_clk_fast:
      dst_clk_i: clk_fast_i
      dst_rst_ni: rst_fast_ni
      src_clk_i: clk_slow_i
      src_rst_ni: rst_slow_ni
    dw_conv_coral_npu_in_128_to_main_coral_npu_in_64:
      clk_i: clk_fast_i
      rst_ni: rst_fast_ni
    dw_conv_main_coral_npu_out_64_to_coral_npu_out_128:
      clk_i: clk_fast_i
      rst_ni: rst_fast_ni
    dw_conv_main_fast_vdma_csr_64_to_fast_vdma_csr_32:
      clk_i: clk_fast_i
      rst_ni: rst_fast_ni
    main:
      clk_i: clk_fast_i
      rst_ni: rst_fast_ni
    pr_conv_cdc_timers_csr_clk_slow_axi4_to_timers_csr_apb3:
      clk_i: clk_slow_i
      rst_ni: rst_slow_ni
    pr_conv_cdc_uart_csr_clk_ahb_axi4_to_uart_csr_ahb3:
      clk_i: clk_ahb_i
      rst_ni: rst_ahb_ni
    pr_conv_dw_conv_fast_vdma_csr_32_axi4_to_fast_vdma_csr_axi4lite:
      clk_i: clk_fast_i
      rst_ni: rst_fast_ni
external:
  interfaces:
    in:
    - veer_el2_ifu
    - veer_el2_lsu
    - veer_eh2_ifu
    - veer_eh2_lsu
    - fast_vdma
    - coral_npu_in
    out:
    - fast_vdma_csr
    - timers_csr
    - coral_npu_out
    - i3c_controller
    - i3c_target
    - uart_csr
  ports:
    in:
    - clk_slow_i
    - rst_slow_ni
    - clk_fast_i
    - rst_fast_ni
    - clk_ahb_i
    - rst_ahb_ni
