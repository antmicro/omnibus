connections:
  interfaces:
    cdc_axi_cpu_clk_cpu_to_sb_cpu_cpu_clk_bus:
      dst:
      - sb_cpu
      - sb_cpu_cpu
      src: axi_cpu
    cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp:
      dst:
      - sb_lpp
      - sb_lpp_up
    pr_conv_sb_lpp_i2c_axi4_to_apb_i2c_apb3:
      dst: apb_i2c
    pr_conv_sb_lpp_uart_axi4_to_apb_uart_apb3:
      dst: apb_uart
    sb_cpu:
      sb_cpu_dbg: axi_dbg
      sb_cpu_lpp:
      - cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp
      - src
      sb_cpu_mem: axi_mem
    sb_lpp:
      sb_lpp_i2c:
      - pr_conv_sb_lpp_i2c_axi4_to_apb_i2c_apb3
      - src
      sb_lpp_uart:
      - pr_conv_sb_lpp_uart_axi4_to_apb_uart_apb3
      - src
  ports:
    cdc_axi_cpu_clk_cpu_to_sb_cpu_cpu_clk_bus:
      dst_clk_i: clk_bus_i
      dst_rst_ni: rst_bus_ni
      src_clk_i: clk_cpu_i
      src_rst_ni: rst_cpu_ni
    cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp:
      dst_clk_i: clk_lpp_i
      dst_rst_ni: rst_lpp_ni
      src_clk_i: clk_bus_i
      src_rst_ni: rst_bus_ni
    pr_conv_sb_lpp_i2c_axi4_to_apb_i2c_apb3:
      clk_i: clk_lpp_i
      rst_ni: rst_lpp_ni
    pr_conv_sb_lpp_uart_axi4_to_apb_uart_apb3:
      clk_i: clk_lpp_i
      rst_ni: rst_lpp_ni
    sb_cpu:
      clk_i: clk_bus_i
      rst_ni: rst_bus_ni
    sb_lpp:
      clk_i: clk_lpp_i
      rst_ni: rst_lpp_ni
external:
  interfaces:
    in:
    - axi_cpu
    - axi_dbg
    out:
    - axi_mem
    - apb_uart
    - apb_i2c
  ports:
    in:
    - clk_bus_i
    - rst_bus_ni
    - clk_cpu_i
    - rst_cpu_ni
    - clk_lpp_i
    - rst_lpp_ni
ips:
  cdc_axi_cpu_clk_cpu_to_sb_cpu_cpu_clk_bus:
    file: file:tests/out/modules/cores/axi_cdc_wrapper/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 1
  cdc_sb_cpu_lpp_clk_bus_to_sb_lpp_up_clk_lpp:
    file: file:tests/out/modules/cores/axi_cdc_wrapper/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 2
  pr_conv_sb_lpp_i2c_axi4_to_apb_i2c_apb3:
    file: file:tests/out/modules/cores/axi_prconv_axi_apb/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 2
  pr_conv_sb_lpp_uart_axi4_to_apb_uart_apb3:
    file: file:tests/out/modules/cores/axi_prconv_axi_apb/module.yaml
    parameters:
      AxiAddrWidth: 32
      AxiDataWidth: 32
      AxiIdWidth: 2
  sb_cpu:
    file: file:tests/out/modules/cores/sb_cpu/module.yaml
    parameters: {}
  sb_lpp:
    file: file:tests/out/modules/cores/sb_lpp/module.yaml
    parameters: {}
name: MyInterconnect
