desc_version: 1.0

name: axi_ic
version: "1.0"

default:
  data_width: 32
  clock: clk
  frequency: 100MHz
  protocol: AXI4

ports:
  from_manager:
    role: "subordinate"
  to_subordinate:
    role: "manager"
    protocol: AXI4Lite

address_map:
  sub:
    to: to_subordinate
    base: 0x0000_0000
    size: 0x1000
