desc_version: 1.0

name: ASoCaInt
version: 0 

global:
  addr_width: 32

default:
  data_width: 64
  axi_max_reads: 2
  clock: clk_fast
  protocol: axi4

clocks:
  clk_slow: 
    frequency: 300MHz
  clk_fast: 
    frequency: 800MHz
  clk_ahb: 
    frequency: 100MHz

ports:
  veer_el2_ifu:
    role: "subordinate"
    clock: clk_slow
  veer_el2_lsu:
    role: "subordinate"
    clock: clk_slow
  veer_eh2_ifu:
    role: "subordinate"
  veer_eh2_lsu:
    role: "subordinate"
  fast_vdma:
    role: "subordinate"
  fast_vdma_csr:
    protocol: axi4_lite
    role: "manager"
    data_width: 32
  timers_csr:
    protocol: apb3
    role: "manager"
    clock: clk_slow
  coral_npu_out:
    role: "manager"
    data_width: 128
  coral_npu_in:
    role: "subordinate"
    data_width: 128
  i3c_controller:
    role: "manager"
    clock: clk_slow
  i3c_target:
    role: "manager"
    clock: clk_slow
  uart_csr:
    protocol: ahb3
    role: "manager"
    clock: clk_ahb

crossbars:
  main: 
    ports:
      veer_el2_ifu:
        role: "subordinate"
      veer_el2_lsu:
        role: "subordinate"
      veer_eh2_ifu:
        role: "subordinate"
      veer_eh2_lsu:
        role: "subordinate"
      fast_vdma:
        role: "subordinate"
      coral_npu_in:
        role: "subordinate"
      fast_vdma_csr:
        role: "manager"
      timers_csr:
        role: "manager"
      coral_npu_out:
        role: "manager"
      i3c_controller:
        role: "manager"
      i3c_target:
        role: "manager"
      uart_csr:
        role: "manager"

connections:
  "veer_el2_ifu -> main.veer_el2_ifu":
  "veer_el2_lsu -> main.veer_el2_lsu":
  "veer_eh2_ifu -> main.veer_eh2_ifu":
  "veer_eh2_lsu -> main.veer_eh2_lsu":
  "fast_vdma -> main.fast_vdma":
  "coral_npu_in -> main.coral_npu_in":
  "main.fast_vdma_csr -> fast_vdma_csr":
  "main.timers_csr -> timers_csr":
  "main.coral_npu_out -> coral_npu_out":
    axi_max_reads: 3
  "main.i3c_controller -> i3c_controller":
  "main.i3c_target -> i3c_target":
  "main.uart_csr -> uart_csr":

address_map:
  "i3c_target_csr":
    to: i3c_target
    base: 0x4000_0000
    size: 0x0000_FFFF
  "i3c_controller_csr":
    to: i3c_controller
    base: 0x4001_0000
    size: 0x0000_FFFF
  "uart_csr":
    to: uart_csr
    base: 0x4002_0000
    size: 0x0000_FFFF
  "timers_csr":
    to: timers_csr
    base: 0x4003_0000
    size: 0x0000_FFFF
  "fastvdma_csr":
    to: fast_vdma_csr
    base: 0x5000_0000
    size: 0x0000_FFFF
  "coral_npu_out":
    to: coral_npu_out
    base: 0x6000_0000
    size: 0x0FFF_FFFF
