connections:
#port -> interconnect
  "i0 -> x00.i0":
  "i1 -> x00.i1":
  "i2 -> x01.i0":
  "i3 -> x01.i1":
  "i4 -> x02.i0":
  "i5 -> x02.i1":
  "i6 -> x03.i0":
  "i7 -> x03.i1":

#1st stage
  "x00.o0 -> x10.i0":
  "x00.o1 -> x12.i0":
  "x01.o0 -> x11.i0":
  "x01.o1 -> x13.i0":
  "x02.o0 -> x10.i1":
  "x02.o1 -> x12.i1":
  "x03.o0 -> x11.i1":
  "x03.o1 -> x13.i1":

#2nd stage
  "x10.o0 -> x20.i0":
  "x10.o1 -> x21.i0":
  "x11.o0 -> x20.i1":
  "x11.o1 -> x21.i1":
  "x12.o0 -> x22.i0":
  "x12.o1 -> x23.i0":
  "x13.o0 -> x22.i1":
  "x13.o1 -> x23.i1":

#interconnect -> port
  "x20.o0 -> o0":
  "x20.o1 -> o1":
  "x21.o0 -> o2":
  "x21.o1 -> o3":
  "x22.o0 -> o4":
  "x22.o1 -> o5":
  "x23.o0 -> o6":
  "x23.o1 -> o7":

address_map:
  "o0":
    to:    o0
    base:  0x0000
    size:  0x1000
  "o1":
    to:    o1
    base:  0x1000
    size:  0x1000
  "o2":
    to:    o2
    base:  0x2000
    size:  0x1000
  "o3":
    to:    o3
    base:  0x3000
    size:  0x1000
